{% load wagtailcore_tags %}
{% if value.ordered %}
    <ol class="pdf-page-list pdf-page-list--ordered">
        {% for item in value.items %}<li>{{ item }}</li>{% endfor %}
    </ol>
{% else %}
    <ul class="pdf-page-list">
        {% for item in value.items %}<li>{{ item }}</li>{% endfor %}
    </ul>
{% endif %}
